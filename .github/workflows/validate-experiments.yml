name: Validate Sonora experiments
on:
  push:
  pull_request:
jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate all lyric packs
        run: python scripts/validate_all_experiments.py
      - name: Audit vocabulary planning and real exposure separation
        run: python scripts/audit_vocabulary.py
