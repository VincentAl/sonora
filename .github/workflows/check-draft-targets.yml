name: Draft target structural checks
on:
  pull_request:
    paths:
      - 'scripts/check_draft_targets.py'
      - '.github/workflows/check-draft-targets.yml'
  workflow_dispatch:
jobs:
  structural-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run deterministic target checks
        run: python3 scripts/check_draft_targets.py --self-test
